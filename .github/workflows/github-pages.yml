# Publie le site sur GitHub Pages à chaque push sur main.
# Le site du dépôt reste inchangé : ce fichier l'adapte en site statique
# uniquement pendant la construction, sur les serveurs de GitHub.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - id: pages
        uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile

      - name: Adapter le site en site statique
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          # 1. Export statique (Cache Components et le proxy demandent un serveur)
          cat > next.config.ts <<'EOF'
          import type { NextConfig } from "next";
          const basePath = process.env.BASE_PATH || undefined;
          const nextConfig: NextConfig = {
            output: "export",
            trailingSlash: true,
            basePath,
            images: { unoptimized: true },
            turbopack: { rules: { "*.css": { loaders: ["@tailwindcss/turbopack"], as: "*.css" } } },
          };
          export default nextConfig;
          EOF
          rm src/proxy.ts
          find src/app -name 'opengraph-image.tsx' -delete
          grep -rl '^export const instant' src/app | xargs perl -ni -e 'print unless /^export const instant = false;$/'
          for f in src/app/robots.ts src/app/sitemap.ts; do echo 'export const dynamic = "force-static";' >> "$f"; done
          # 2. Sous une adresse /nom-du-depot/, les images et le bouton FR/EN
          #    doivent commencer par ce préfixe (les autres liens l'ajoutent seuls)
          if [ -n "$BASE_PATH" ]; then
            grep -rl '/figures/' src | xargs perl -pi -e 's#(["`])/figures/#$1$ENV{BASE_PATH}/figures/#g'
            perl -pi -e 's#href=\{switchPath\(pathname, l\)\}#href={"$ENV{BASE_PATH}" + switchPath(pathname, l)}#' src/components/layout/LangSwitch.tsx
            grep -qF "\"$BASE_PATH\" + switchPath" src/components/layout/LangSwitch.tsx || { echo "LangSwitch.tsx a changé : adapter cette étape"; exit 1; }
          fi

      - name: Construire
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: pnpm exec next build

      - name: Recréer les adresses publiques
        working-directory: out
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          # Pages en français à la racine : /recherche/ et non /fr/recherche/
          cp -R fr/. .
          # Pages en anglais sous leur nom anglais : /en/research/
          for p in parcours:career recherche:research communications:talks vulgarisation:outreach \
                   enseignement:teaching projets:projects outils:tools these:thesis laboratoire:lab; do
            cp -R "en/${p%%:*}" "en/${p##*:}"
          done
          # Page « introuvable » du site pour toute adresse inconnue
          cp fr/introuvable/index.html 404.html
          # Anciennes adresses
          redirect() {
            mkdir -p "$1"
            printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=%s/"><link rel="canonical" href="%s/">\n' \
              "$BASE_PATH$2" "$BASE_PATH$2" > "$1/index.html"
          }
          redirect communication /communications
          redirect methodes /outils
          redirect a-propos /parcours
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
